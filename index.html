<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Cumpleaños!</title>
    
    <!-- Configuración para la vista previa de WhatsApp -->
    <meta property="og:title" content="¡Tengo un mensaje para ti! 🎂">
    <meta property="og:description" content="Haz clic para abrir tu tarjeta de cumpleaños.">
    <meta property="og:image" content="https://tusitio.com">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #feb47b, #ff7e5f);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
        }
        .card {
            background: rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            max-width: 80%;
        }
        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        p { font-size: 1.2rem; }
        .cake { font-size: 4rem; animation: float 3s ease-in-out infinite; }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="cake">🎂</div>
        <h1>¡Feliz Cumpleaños!</h1>
        <p>Que este día esté lleno de risas, alegría y muchos pasteles. ¡Disfruta al máximo!</p>
    </div>

</body>
</html>
